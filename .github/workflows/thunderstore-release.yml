name: Thunderstore release

on:
  workflow_dispatch:
    inputs:
      game_version:
        description: Exact installed Valheim version required on the test runner
        required: true
        default: 1.0.15
        type: string
      publish:
        description: Publish the tested ZIPs after environment approval
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: thunderstore-production
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: [self-hosted, Windows, X64, valheim]
    timeout-minutes: 30
    env:
      TARGET_GAME_VERSION: ${{ inputs.game_version }}
    steps:
      - name: Check out pipeline
        uses: actions/checkout@v7
        with:
          path: repos/deepnorthtesting

      - name: Check out Valheim Profile Manager
        uses: actions/checkout@v7
        with:
          repository: djcdevelopment/valheim-profile-engine
          path: repos/valheim-profile-engine

      - name: Check out IsModded
        uses: actions/checkout@v7
        with:
          repository: djcdevelopment/ismodded
          path: repos/ismodded

      - name: Check out SelfieStick
        uses: actions/checkout@v7
        with:
          repository: djcdevelopment/SelfieStick
          path: repos/SelfieStick

      - name: Check out Unfaded
        uses: actions/checkout@v7
        with:
          repository: djcdevelopment/Unfaded
          path: repos/Unfaded

      - name: Check out TotemSentinel
        uses: actions/checkout@v7
        with:
          repository: djcdevelopment/TotemSentinel
          path: repos/totemalert

      - name: Install pinned Thunderstore CLI
        shell: powershell
        run: |
          if (dotnet tool list --global | Select-String '^tcli\s') {
            dotnet tool update --global tcli --version 0.2.4
          } else {
            dotnet tool install --global tcli --version 0.2.4
          }

      - name: Build release candidates and evidence
        shell: powershell
        run: |
          $workspaceRoot = Join-Path $env:GITHUB_WORKSPACE "repos"
          $repositoryRoot = Join-Path $workspaceRoot "deepnorthtesting"
          $evidenceRoot = Join-Path $env:GITHUB_WORKSPACE "evidence"
          & "$repositoryRoot\tools\Invoke-PatchPipeline.ps1" `
            -All `
            -TargetGameVersion $env:TARGET_GAME_VERSION `
            -WorkspaceRoot $workspaceRoot `
            -RepositoryRoot $repositoryRoot `
            -ProfileManagerRoot (Join-Path $workspaceRoot "valheim-profile-engine") `
            -EvidenceDirectory $evidenceRoot

      - name: Upload immutable release candidates
        uses: actions/upload-artifact@v7
        with:
          name: thunderstore-candidates-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 30

  publish:
    if: ${{ inputs.publish }}
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 10
    environment: thunderstore-production
    steps:
      - name: Check out publisher
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install pinned Thunderstore CLI
        shell: powershell
        run: dotnet tool install --global tcli --version 0.2.4

      - name: Download tested candidates
        uses: actions/download-artifact@v8
        with:
          name: thunderstore-candidates-${{ github.run_id }}
          path: evidence

      - name: Publish exact tested ZIPs
        shell: powershell
        env:
          THUNDERSTORE_TOKEN: ${{ secrets.THUNDERSTORE_TOKEN }}
        run: |
          & .\tools\Publish-ThunderstoreArtifacts.ps1 `
            -ArtifactsDirectory .\evidence\packages `
            -Token $env:THUNDERSTORE_TOKEN `
            -Confirm PUBLISH

      - name: Upload publish receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: thunderstore-publish-receipt-${{ github.run_id }}
          path: evidence/packages/publish-receipt.json
          if-no-files-found: warn
