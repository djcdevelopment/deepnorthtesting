[config]
schemaVersion = '0.0.1'

[package]
namespace = 'djcdevelopment'
name = 'SelfieStick'
versionNumber = '0.3.6'
description = 'Valheim 1.0-1.0.21 photography engine: exact lens positioning, unattended 4K capture, weather control, and proof receipts.'
websiteUrl = 'https://github.com/djcdevelopment/SelfieStick'
containsNsfwContent = false

[package.dependencies]
denikson-BepInExPack_Valheim = '5.4.2202'

[build]
icon = './icon.png'
readme = './README.md'
outdir = './dist'

[[build.copy]]
source = './bin/Release/net472/CameraProof.dll'
target = 'CameraProof.dll'

[publish]
repository = 'https://thunderstore.io'
communities = [ 'valheim' ]

[publish.categories]
valheim = [ 'mods', 'client-side', 'misc' ]
